<!DOCTYPE html>
<html lang="ru" data-theme="light" data-font="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Канбан-доска</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">

  <!-- Применяем тему и размер шрифта ДО отрисовки, чтобы не было «мигания» -->
  <script>
    (function () {
      var theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var font = 'medium';
      try {
        // TODO: заменить на fetch('/api/profile') — но тему лучше оставить в localStorage для мгновенного старта
        var state = JSON.parse(localStorage.getItem('kanban_state') || 'null');
        if (state && state.profile && state.profile.settings) {
          theme = state.profile.settings.theme || theme;
          font = state.profile.settings.fontSize || font;
        }
      } catch (e) { /* повреждённые данные — используем значения по умолчанию */ }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.font = font;
    })();
  </script>

  <!-- Шрифт B612 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Стили: общие + по страницам -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/boards.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="app-shell">
    <!-- Боковая панель: содержимое рисует js/sidebar.js -->
    <aside class="sb" id="sidebar" aria-label="Основная навигация"></aside>

    <div class="app-content">
      <!-- Верхняя панель -->
      <header class="app-header" id="app-header">
        <button type="button" class="sb-open-btn" id="sb-open" aria-label="Открыть меню" title="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="app-logo" href="#/boards">Канбан</a>
        <!-- Мини-аватар профиля; содержимое заполняет app.js -->
        <a class="header-profile" id="header-profile" href="#/profile" aria-label="Профиль"></a>
      </header>

      <!-- Контейнеры страниц: app.js показывает нужный, остальные скрывает -->
      <main class="app-main" id="app">
        <section class="page" id="page-boards" hidden></section>
        <section class="page page--board" id="page-board" hidden></section>
        <section class="page" id="page-profile" hidden></section>
        <section class="page" id="page-view" hidden></section> <!-- дашборд, задачи, уведомления, архив, команда, поддержка -->
        <section class="page" id="page-not-found" hidden>
          <div class="empty-state">
            <div class="empty-state__icon">🧭</div>
            <h2>Страница не найдена</h2>
            <p>Такого адреса нет. Вернитесь к списку досок.</p>
            <a class="btn btn--primary" href="#/boards">К доскам</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="sb-backdrop" id="sb-backdrop"></div>

  <!-- Корень для модальных окон (карточка, подтверждения) -->
  <div id="modal-root"></div>

  <!-- Контейнер для toast-уведомлений -->
  <div id="toasts" role="status" aria-live="polite"></div>

  <noscript>Для работы приложения нужен включённый JavaScript.</noscript>

  <!--
    Порядок важен: сначала данные, потом страницы, в конце — роутер.
    Обычные <script> (не type="module"), чтобы всё работало при открытии index.html двойным кликом (file://).
  -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/boards.js"></script>
  <script src="js/board.js"></script>
  <script src="js/card.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
  <!-- Загрузка библиотеки Google -->
<script src="https://accounts.google.com/gsi/client" async></script>

</html>
